<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" fill="none">
  <defs>
    <linearGradient id="sn_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="sn_glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sn_highlighter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect width="300" height="180" rx="14" fill="url(#sn_bg)"/>
  <rect width="300" height="180" fill="url(#sn_glow)"/>

  <!-- NCERT High-Yield Short Notes Graphic -->
  <g transform="translate(225, 95)">
    <!-- Back Notebook Page -->
    <rect x="-38" y="-45" width="62" height="78" rx="6" fill="#115e59" stroke="#2dd4bf" stroke-width="1.5" transform="rotate(-12)"/>
    <!-- Middle Summary Sheet -->
    <rect x="-32" y="-42" width="62" height="78" rx="6" fill="#042f2e" stroke="#5eead4" stroke-width="1.8" transform="rotate(-4)"/>
    
    <!-- Front High-Yield Note Sheet -->
    <g transform="rotate(6)">
      <rect x="-26" y="-38" width="64" height="80" rx="6" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
      
      <!-- Bookmark ribbon -->
      <path d="M12 -38 L12 -20 L18 -24 L24 -20 L24 -38 Z" fill="#f59e0b"/>

      <!-- Highlighted Key Concept Stroke -->
      <rect x="-18" y="-22" width="26" height="7" rx="2" fill="url(#sn_highlighter)"/>
      <line x1="-16" y1="-18" x2="6" y2="-18" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>

      <!-- Bullet Point 1 -->
      <circle cx="-16" cy="-4" r="2" fill="#0d9488"/>
      <line x1="-10" y1="-4" x2="20" y2="-4" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

      <!-- Highlighted Keyword 2 -->
      <rect x="-10" y="8" width="30" height="7" rx="2" fill="url(#sn_highlighter)"/>
      <circle cx="-16" cy="12" r="2" fill="#0d9488"/>
      <line x1="-8" y1="12" x2="18" y2="12" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>

      <!-- Formula Pill Box -->
      <rect x="-16" y="24" width="38" height="10" rx="3" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1"/>
      <line x1="-10" y1="29" x2="16" y2="29" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>