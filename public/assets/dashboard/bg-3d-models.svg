<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" fill="none">
  <defs>
    <linearGradient id="m3d_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="m3d_glow" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="180" rx="14" fill="url(#m3d_bg)"/>
  <rect width="300" height="180" fill="url(#m3d_glow)"/>

  <!-- 3D Model Wireframe & Interactive Coordinate Geometry -->
  <g transform="translate(225, 90)">
    <!-- Gyro Orbital Rotation Rings -->
    <ellipse cx="0" cy="0" rx="42" ry="18" fill="none" stroke="#60a5fa" stroke-width="1.4" stroke-dasharray="3 3" transform="rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="42" ry="18" fill="none" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="3 3" transform="rotate(35)"/>

    <!-- Central Interactive 3D Isometric Cube -->
    <!-- Top Face -->
    <polygon points="0,-28 24,-14 0,0 -24,-14" fill="#38bdf8" fill-opacity="0.85" stroke="#7dd3fc" stroke-width="1.5"/>
    <!-- Left Face -->
    <polygon points="-24,-14 0,0 0,28 -24,14" fill="#1d4ed8" fill-opacity="0.85" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Right Face -->
    <polygon points="0,0 24,-14 24,14 0,28" fill="#4338ca" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.5"/>

    <!-- Inner 3D Coordinate Axis Vertex Nodes -->
    <circle cx="0" cy="-28" r="3" fill="#ffffff"/>
    <circle cx="24" cy="-14" r="3" fill="#38bdf8"/>
    <circle cx="-24" cy="-14" r="3" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="3.5" fill="#f43f5e"/>
    <circle cx="0" cy="28" r="3" fill="#818cf8"/>
    <circle cx="-24" cy="14" r="3" fill="#60a5fa"/>
    <circle cx="24" cy="14" r="3" fill="#a78bfa"/>

    <!-- Small 3D Orbiting Atom / Molecule Satellites -->
    <circle cx="36" cy="-24" r="2.5" fill="#38bdf8"/>
    <circle cx="-34" cy="22" r="2.5" fill="#c084fc"/>
    <circle cx="-38" cy="-16" r="2" fill="#34d399"/>
  </g>
</svg>