<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" fill="none">
  <defs>
    <linearGradient id="bk_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="60%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="bk_glow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="180" rx="14" fill="url(#bk_bg)"/>
  <rect width="300" height="180" fill="url(#bk_glow)"/>

  <!-- Ornate Golden Ribbon Bookmark & Star Badge -->
  <g transform="translate(225, 85)">
    <!-- Silk Ribbon Hanging -->
    <path d="M-15 -60 L18 -60 L18 35 L1.5 20 L-15 35 Z" fill="#f59e0b" fill-opacity="0.85" stroke="#fef3c7" stroke-width="2"/>
    <path d="M-7 -60 L-7 25" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.7"/>

    <!-- High-Yield 5-Point Gold Star -->
    <g transform="translate(-25, 10)">
      <polygon points="0,-18 5,-5 18,-5 8,4 12,18 0,9 -12,18 -8,4 -18,-5 -5,-5" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>
    </g>

    <!-- Notes Card Lines -->
    <g opacity="0.35" stroke="#fde68a" stroke-width="1.8">
      <line x1="-55" y1="-30" x2="-25" y2="-30"/>
      <line x1="-55" y1="-18" x2="-30" y2="-18"/>
      <line x1="-55" y1="-6" x2="-35" y2="-6"/>
    </g>
  </g>
</svg>