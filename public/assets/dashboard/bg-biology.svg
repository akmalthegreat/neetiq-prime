<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="b_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="60%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <radialGradient id="b_glow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7e22ce" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#b_bg)"/>
  <rect width="400" height="240" fill="url(#b_glow)"/>

  <!-- DNA Double Helix Structure -->
  <g transform="translate(305, 120) rotate(-25)">
    <!-- Wave 1 -->
    <path d="M-120 -25 Q -90 -60, -60 -25 T 0 -25 T 60 -25 T 120 -25" stroke="#f0abfc" stroke-width="3" fill="none" stroke-opacity="0.9"/>
    <!-- Wave 2 (counter phase) -->
    <path d="M-120 25 Q -90 60, -60 25 T 0 25 T 60 25 T 120 25" stroke="#c084fc" stroke-width="3" fill="none" stroke-opacity="0.9"/>

    <!-- Base pair rungs -->
    <line x1="-105" y1="-38" x2="-105" y2="38" stroke="#e9d5ff" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="-105" cy="-38" r="3.5" fill="#fdf4ff"/>
    <circle cx="-105" cy="38" r="3.5" fill="#fdf4ff"/>

    <line x1="-75" y1="-38" x2="-75" y2="38" stroke="#e9d5ff" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="-75" cy="-38" r="3.5" fill="#fdf4ff"/>
    <circle cx="-75" cy="38" r="3.5" fill="#fdf4ff"/>

    <line x1="-45" y1="-10" x2="-45" y2="10" stroke="#e9d5ff" stroke-width="2" stroke-opacity="0.7"/>

    <line x1="-15" y1="-38" x2="-15" y2="38" stroke="#e9d5ff" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="-15" cy="-38" r="3.5" fill="#fdf4ff"/>
    <circle cx="-15" cy="38" r="3.5" fill="#fdf4ff"/>

    <line x1="15" y1="-38" x2="15" y2="38" stroke="#e9d5ff" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="15" cy="-38" r="3.5" fill="#fdf4ff"/>
    <circle cx="15" cy="38" r="3.5" fill="#fdf4ff"/>

    <line x1="45" y1="-10" x2="45" y2="10" stroke="#e9d5ff" stroke-width="2" stroke-opacity="0.7"/>

    <line x1="75" y1="-38" x2="75" y2="38" stroke="#e9d5ff" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="75" cy="-38" r="3.5" fill="#fdf4ff"/>
    <circle cx="75" cy="38" r="3.5" fill="#fdf4ff"/>

    <line x1="105" y1="-38" x2="105" y2="38" stroke="#e9d5ff" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- Cell Organelle / Microscopic Rings -->
  <g transform="translate(190, 80)" opacity="0.3">
    <ellipse cx="0" cy="0" rx="35" ry="24" stroke="#e879f9" stroke-width="1.8" stroke-dasharray="4 3"/>
    <circle cx="-5" cy="-2" r="10" fill="#f0abfc" fill-opacity="0.3"/>
    <circle cx="12" cy="8" r="4" fill="#c084fc"/>
  </g>
</svg>